# Production (VPS) : Traefik tourne déjà et expose le réseau « traefik-network ».
# Variables attendues (fichier .env à côté de ce fichier) :
#   MYSQL_ROOT_PASSWORD, DB_PASS
# Lancement : docker compose -f docker-compose.prod.yml up -d --build
networks:
  traefik-network:
    external: true   # Traefik tourne déjà sur le VPS avec ce réseau
  internal:
    driver: bridge   # réseau privé pour MySQL

services:

  # ── Base de données ──────────────────────────────────────────
  db:
    image: mysql:9.1
    restart: unless-stopped
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gestion_personnel
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - db_data:/var/lib/mysql
      # Import initial uniquement (premier démarrage). Pas de dev-passwords.sql en prod.
      - ./database/gestion_personnel.sql:/sql/gestion_personnel.sql:ro
      - ./.docker/fix-view-moteur-alertes.sql:/sql/fix-view-moteur-alertes.sql:ro
      - ./.docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # ── Application PHP / Apache ─────────────────────────────────
  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile.prod
    restart: unless-stopped
    networks:
      - traefik-network
      - internal
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: gestion_personnel
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      APP_DEBUG: '0'
    volumes:
      - uploads_data:/var/www/html/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.rh.rule=Host(`ressource-humaine.flycelest.com`)"
      - "traefik.http.routers.rh.entrypoints=websecure"
      - "traefik.http.routers.rh.tls=true"
      - "traefik.http.routers.rh.tls.certresolver=letsencrypt"
      - "traefik.http.services.rh.loadbalancer.server.port=80"

volumes:
  db_data:
  uploads_data:
